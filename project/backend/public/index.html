<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Error Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar" hidden>
        <a class="brand" href="#/dashboard"><span class="brand-mark"></span>ERROR&nbsp;TRACKER</a>
        <nav class="nav" id="nav" aria-label="Main">
          <a href="#/dashboard" data-nav="dashboard">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8M5 9.5V21h14V9.5"/></svg>Dashboard
          </a>
          <a href="#/projects" data-nav="projects">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects
          </a>
        </nav>
        <div class="nav nav-bottom">
          <button class="nav-btn" id="logout" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h10"/></svg>Log out
          </button>
        </div>
      </aside>
      <div class="content">
        <header class="topbar" id="topbar" hidden>
          <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
          <div class="theme-toggle" role="group" aria-label="Theme">
            <button type="button" data-theme-set="dark" aria-label="Dark theme" title="Dark">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            </button>
            <button type="button" data-theme-set="light" aria-label="Light theme" title="Light">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
          </div>
        </header>
        <main id="app" aria-live="polite"></main>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
